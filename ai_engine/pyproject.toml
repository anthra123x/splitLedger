[project]
name = "analista-de-datos"
version = "1.0.0"
description = "Motor Neuro-Simbólico de Razonamiento, Auditoría Forense y Descomposición de Datos Financieros de Alto Volumen"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Anthra123x", email = "anthra123x@users.noreply.github.com" }
]
keywords = [
    "llm", "reasoning", "accounting", "financial-analysis", "forensic-audit",
    "duckdb", "polars", "benford-law", "neuro-symbolic", "rouche-frobenius"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
analista = "cli:app"
analista-cli = "cli:app"

[project.urls]
Homepage = "https://github.com/anthra123x/analista-de-datos"
Repository = "https://github.com/anthra123x/analista-de-datos.git"
Issues = "https://github.com/anthra123x/analista-de-datos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analista_de_datos", "app"]
