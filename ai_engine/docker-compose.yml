version: "3.8"

services:
  analista-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analista_de_datos
    ports:
      - "8100:8100"
    environment:
      - APP_NAME=Analista de Datos
      - APP_VERSION=1.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen-2.5-72b-instruct}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
